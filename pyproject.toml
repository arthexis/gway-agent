[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gway-agent"
version = "0.1.0"
description = "Codex skills, hooks, and tools for the gway ecosystem"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Arthexis" }]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gway_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
